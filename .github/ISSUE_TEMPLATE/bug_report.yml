name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → Updates → Installed version
      placeholder: 0.1.42
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 14, Pixel 8
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server type
      description: For example Atlas (tier), or self-hosted with the MongoDB version
      placeholder: Atlas M10, or self-hosted 7.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error message shown.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords and other secrets from connection strings, logs and screenshots.
          required: true
