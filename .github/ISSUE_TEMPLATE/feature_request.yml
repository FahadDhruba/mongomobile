name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you have tried, such as Compass or mongosh.
