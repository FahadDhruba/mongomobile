name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: secret
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd packages/mongo_wire && dart pub get)

      - name: Analyze
        run: flutter analyze

      - name: Driver tests (unit and integration against mongo:7)
        working-directory: packages/mongo_wire
        env:
          MONGO_URI: mongodb://root:secret@localhost:27017/?authSource=admin
        run: dart test --reporter expanded

      - name: App tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set; the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="${{ github.run_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/mongomobile-$VERSION_NAME.apk"
          sha256sum "dist/mongomobile-$VERSION_NAME.apk" > "dist/mongomobile-$VERSION_NAME.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mongomobile-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MongoMobile ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/mongomobile-${{ env.VERSION_NAME }}.apk
            dist/mongomobile-${{ env.VERSION_NAME }}.apk.sha256
          body: |
            Android APK for MongoMobile ${{ env.VERSION_NAME }}, built from ${{ github.sha }}.

            Download `mongomobile-${{ env.VERSION_NAME }}.apk` on your phone and open it to install.
            See the README for step-by-step instructions.
